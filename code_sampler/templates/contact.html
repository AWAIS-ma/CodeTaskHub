{% extends "layout.html" %}
{% block title %}
contact us
{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2>Contact Us</h2>
    <form>
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" rows="3" placeholder="Enter your message" required></textarea>
        </div>
        <div class="form-group">
            <label for="need">Need</label>
            <input type="text" class="form-control" id="need" placeholder="What do you need help with?" required>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>


<div class="mt-auto">
    <div class="d-flex justify-content-between mb-2">
        <a href="{% url 'home' %}" class="btn btn-outline-primary btn-sm">Go Back!</a>
    </div>
</div>
{% endblock %}
